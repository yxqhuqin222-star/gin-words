  function genLocalUid(){

        if(Array.isArray(list)){
          mastered.clear();
          list.forEach(function(en){ if(en) mastered.add(en); });
        }
      }
    }catch(e){ /* ignore */ }
    // 再从云端拉取最新进度
    try{
      var res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "get", uid: uid })
      });
      var r = await res.json();
      if(r && r.ok && Array.isArray(r.mastered)){
        if(opts.merge){
          // 合并模式：把云端进度合并进本地（用于登录时保留本机进度）
          r.mastered.forEach(function(en){ if(en) mastered.add(en); });
        }else{
          // 覆盖模式：云端为准
          mastered.clear();
          r.mastered.forEach(function(en){ if(en) mastered.add(en); });
        }
      }
    }catch(e){
      console.warn("云端读取失败，使用本地进度：", e);
      if(opts.showError) setStatus("同步失败，使用本地进度");
    }
    updateProgress();
    render();
  }

  async function saveProgress(){
    // 本地兜底写入
    try{
      localStorage.setItem("wq_mastered", JSON.stringify(Array.from(mastered)));
    }catch(e){ /* ignore */ }
    // 云端同步
    try{
      var res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "set", uid: uid, mastered: Array.from(mastered) })
      });
      var r = await res.json();
      if(r && r.ok){
        setStatus("进度已同步到云端");
      }else{
        setStatus("云端保存失败：" + (r && r.error ? r.error : "unknown"));
      }
    }catch(e){
      console.warn("云端保存失败：", e);
      setStatus("云端保存失败，仅本地生效");
    }
  }

  function toggleMastered(en, on, cardEl){
    if(on) mastered.add(en); else mastered.delete(en);
    if(cardEl) cardEl.classList.toggle("done", on);
    updateProgress();
    saveProgress();
  }

  var listEl     = document.getElementById("list");
  var catEl      = document.getElementById("catFilter");
  var searchEl   = document.getElementById("search");
  var statusEl   = document.getElementById("status");
  var countEl    = document.getElementById("count");
  var totalEl    = document.getElementById("total");
  var progressEl = document.getElementById("progress");
  var resetBtn   = document.getElementById("resetBtn");
  var accountLabel = document.getElementById("accountLabel");
  var phoneInput = document.getElementById("phoneInput");
  var loginBtn   = document.getElementById("loginBtn");
  var logoutBtn  = document.getElementById("logoutBtn");
  var loginHint  = document.getElementById("loginHint");

  function maskPhone(t){ return t.length >= 7 ? (t.slice(0,3) + "****" + t.slice(7)) : t; }
  function updateLoginUI(){
    if(account){
      accountLabel.textContent = "已登录：" + maskPhone(account);
      accountLabel.style.display = "";
      phoneInput.style.display = "none";
      loginBtn.style.display = "none";
      logoutBtn.style.display = "";
      loginHint.style.display = "none";
    }else{
      accountLabel.style.display = "none";
      phoneInput.style.display = "";
      loginBtn.style.display = "";
      logoutBtn.style.display = "none";
      loginHint.style.display = "";
    }
  }

  loginBtn.addEventListener("click", async function(){
    var tel = (phoneInput.value || "").trim();
    if(!/^1\d{10}$/.test(tel)){ setStatus("请输入正确的 11 位手机号"); return; }
    account = tel;
    localStorage.setItem("wq_account", tel);
    uid = await accountUid(tel);
    localStorage.setItem("wq_uid", uid);
    updateLoginUI();
    // 登录时合并本机进度 + 云端进度，避免任一设备进度丢失
    var localSnapshot = Array.from(mastered);
    await loadProgress({ merge: true });
    if(localSnapshot.length){
      localSnapshot.forEach(function(e){ mastered.add(e); });
      updateProgress(); render();
      await saveProgress();
    }
    setStatus("已登录，进度跨设备同步");
  });
  logoutBtn.addEventListener("click", async function(){
    localStorage.removeItem("wq_account");
    account = null;
    uid = genLocalUid();
    localStorage.setItem("wq_uid", uid);
    updateLoginUI();
    await loadProgress();
  });

  // 分类下拉
  var cats = [];
  WORDS.forEach(function(w){ if(cats.indexOf(w.cat)<0) cats.push(w.cat); });
  cats.sort();
  cats.forEach(function(c){
    var o = document.createElement("option");
    o.value = c; o.textContent = c; catEl.appendChild(o);
  });
  totalEl.textContent = WORDS.length;

  var statusTimer = null;
  function setStatus(msg){
    statusEl.textContent = msg || "";
    if(statusTimer) clearTimeout(statusTimer);
    if(msg){
      statusTimer = setTimeout(function(){ statusEl.textContent = ""; }, 2500);
    }
  }

  // ---- 朗读：默认英式 en-GB，无则回退 en-US ----
  var voiceReady = false;
  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices();
    if(!voices.length) return null;
    return voices.find(function(v){ return v.lang === "en-GB"; })
        || voices.find(function(v){ return v.lang === "en-US"; })
        || voices.find(function(v){ return /^en/i.test(v.lang); })
        || null;
  }
  function speak(text, btn){
    if(!("speechSynthesis" in window)){
      setStatus("此浏览器不支持语音朗读");
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice();
    if(v){ u.lang = v.lang; u.voice = v; }
    else { u.lang = "en-GB"; }
    u.rate = 0.95;
    u.onstart = function(){ setStatus("正在朗读…"); if(btn) btn.classList.add("playing"); };
    u.onend   = function(){ setStatus(""); if(btn) btn.classList.remove("playing"); };
    u.onerror = function(){ setStatus("朗读失败，请重试"); if(btn) btn.classList.remove("playing"); };
    window.speechSynthesis.speak(u);
  }
  if("speechSynthesis" in window){
    if(window.speechSynthesis.getVoices().length){ voiceReady = true; }
    window.speechSynthesis.onvoiceschanged = function(){ voiceReady = true; };
  } else {
    setStatus("提示：当前浏览器不支持语音，可用 Chrome / Edge / Safari");
  }

  function render(){
    var cat = catEl.value;
    var q = searchEl.value.trim().toLowerCase();
    var items = WORDS.filter(function(w){
      if(cat && w.cat !== cat) return false;
      if(q){
        var hay = (w.en + " " + w.zh + " " + (w.phrase||"")).toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    listEl.innerHTML = "";
    if(!items.length){
      listEl.innerHTML = '<div class="empty">没有匹配的单词</div>';
      countEl.textContent = "0 个";
      return;
    }
    countEl.textContent = items.length + " 个";
    items.forEach(function(w){
      var card = document.createElement("div");
      card.className = "card" + (mastered.has(w.en) ? " done" : "");

      var row = document.createElement("div");
      row.className = "row";

      var left = document.createElement("div");
      left.style.flex = "1";
      var en = document.createElement("div");
      en.className = "en"; en.textContent = w.en;
      var zh = document.createElement("div");
      zh.className = "zh"; zh.textContent = w.zh;
      left.appendChild(en); left.appendChild(zh);

      var spk = document.createElement("button");
      spk.className = "spk"; spk.type = "button";
      spk.setAttribute("aria-label", "朗读 " + w.en);
      spk.textContent = "🔊";
      spk.addEventListener("click", function(ev){
        ev.stopPropagation();
        speak(w.en, spk);
      });

      row.appendChild(left); row.appendChild(spk);

      var tag = document.createElement("span");
      tag.className = "cat-tag"; tag.textContent = w.cat;

      card.appendChild(row);
      if(w.phrase){ var p = document.createElement("div"); p.className="phrase"; p.textContent = w.phrase; card.appendChild(p); }
      card.appendChild(tag);

      var toggle = document.createElement("label");
      toggle.className = "mastered-toggle";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = mastered.has(w.en);
      cb.setAttribute("aria-label", "标记 " + w.en + " 已掌握");
      cb.addEventListener("click", function(ev){ ev.stopPropagation(); });
      cb.addEventListener("change", function(){ toggleMastered(w.en, cb.checked, card); });
      var tlabel = document.createElement("span");
      tlabel.textContent = "已掌握";
      toggle.appendChild(cb); toggle.appendChild(tlabel);
      card.appendChild(toggle);

      card.addEventListener("click", function(){ speak(w.en, spk); });
      listEl.appendChild(card);
    });
  }

  catEl.addEventListener("change", render);
  searchEl.addEventListener("input", render);
  resetBtn.addEventListener("click", function(){
    mastered.clear();
    updateProgress();
    render();
    saveProgress();
  });

  updateProgress();
  render();
  updateLoginUI();
  (async function(){
    if(account){
      try{ uid = await accountUid(account); localStorage.setItem("wq_uid", uid); }catch(e){}
    }
    await loadProgress();
  })();

  // 切回页面时自动同步云端最新进度（跨设备场景）
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      loadProgress({ showError: false });
    }
  });
})();
</script>
</body>
</html>
