<script type="module">
(function(){
  "use strict";
  var WORDS = [];
  try{
    WORDS = JSON.parse(document.getElementById("word-data").textContent);
  }catch(e){
    console.error("词库解析失败：", e);
    document.getElementById("list").innerHTML = '<div class="empty">词库加载失败</div>';
    return;
  }
  try{
    var LIFE_WORDS = JSON.parse(document.getElementById("life-word-data").textContent);
    if(Array.isArray(LIFE_WORDS)) WORDS = WORDS.concat(LIFE_WORDS);
  }catch(e){ console.error("生活常用词库解析失败：", e); }

  var SENTENCES = [];
  try{
    SENTENCES = JSON.parse(document.getElementById("sentence-data").textContent);
  }catch(e){
    console.error("句库解析失败：", e);
    SENTENCES = [];
  }

  // 两种学习数据：单词卡 / 常用句
  var DATASETS = {
    words:     { key:"words",     items: WORDS,     noun:"单词" },
    sentences: { key:"sentences", items: SENTENCES, noun:"句子" }
  };
  // 上层分类与场景分类分开：当前词库默认归入「欧洲旅游」，后续只需给条目补 topic 即可新增分类。
  var DEFAULT_TOPIC = "欧洲旅游";
  function topicOf(item){ return item.topic || DEFAULT_TOPIC; }
  var activeKey = "words";
  var items = DATASETS[activeKey].items;

  // ===== 学习进度（云端同步 + 本地兜底） =====
  // 云端接口：POST https://xiaoqin-d0g0prppaa09e675e.service.tcloudbase.com/wp
  // 入参 { action:"get"|"set", uid, mastered:[...] }，返回 { ok, mastered:[...] }
  var API = "https://xiaoqin-d0g0prppaa09e675e.service.tcloudbase.com/wp";
  var mastered = new Set();

  // 进度按数据集分别存储：本地独立 key；登录后两个数据集都同步到云端
  (function(){
    try{
      if(!localStorage.getItem("wq_mastered_words") && localStorage.getItem("wq_mastered")){
        localStorage.setItem("wq_mastered_words", localStorage.getItem("wq_mastered"));
      }
    }catch(e){}
  })();
  function loadLocalMastered(key){
    try{
      var raw = localStorage.getItem("wq_mastered_" + key);
      if(raw){ var a = JSON.parse(raw); if(Array.isArray(a)) return new Set(a); }
    }catch(e){}
    return new Set();
  }
  function saveLocalMastered(key, set){
    try{ localStorage.setItem("wq_mastered_" + key, JSON.stringify(Array.from(set))); }catch(e){}
  }
  mastered = loadLocalMastered(activeKey);

  // uid 来源：登录后用手机号派生的稳定 uid（跨设备一致）；未登录用本机随机 uid（仅本机）
  function genLocalUid(){
    var u = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("u-" + Date.now() + "-" + Math.random().toString(16).slice(2));
    return u;
  }
  var uid = localStorage.getItem("wq_uid") || genLocalUid();
  localStorage.setItem("wq_uid", uid);
  var account = localStorage.getItem("wq_account") || null; // 已登录手机号

  // 手机号 -> 云端稳定 uid（SHA-256，避免直接暴露手机号）
  async function accountUid(tel){
    try{
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(tel + "@euro-words"));
      return "a-" + Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    }catch(e){
      // 兜底：不支持 subtle 时退化为简单哈希
      var h = 0; for(var i=0;i<tel.length;i++){ h = (h*31 + tel.charCodeAt(i)) >>> 0; }
      return "a-fallback-" + h;
    }
  }

  function updateProgress(){
    if(progressEl) progressEl.textContent = "已掌握 " + mastered.size + " / " + items.length;
  }

  async function loadProgress(opts){
    opts = opts || {};
    // 本地兜底优先：按当前数据集读取，保证秒开
    mastered = loadLocalMastered(activeKey);
    // 登录后按数据集同步云端；匿名状态只使用本机进度
    if(account){
      try{
        var res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get", uid: uid, scope: activeKey })
        });
        var r = await res.json();
        if(r && r.ok && Array.isArray(r.mastered)){
          if(opts.merge){
            r.mastered.forEach(function(en){ if(en) mastered.add(en); });
          }else{
            mastered = new Set();
            r.mastered.forEach(function(en){ if(en) mastered.add(en); });
          }
        }
      }catch(e){
        console.warn("云端读取失败，使用本地进度：", e);
        if(opts.showError) setStatus("同步失败，使用本地进度");
      }
    }
    updateProgress();
    render();
  }

  async function saveProgress(){
    // 本地兜底写入（按当前数据集）
    saveLocalMastered(activeKey, mastered);
    // 匿名状态只保存本机；登录后按数据集同步云端
    if(!account) return;
    try{
      var res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "set", uid: uid, scope: activeKey, mastered: Array.from(mastered) })
      });
      var r = await res.json();
      if(r && r.ok){
        setStatus("进度已同步到云端");
      }else{
        setStatus("云端保存失败：" + (r && r.error ? r.error : "unknown"));
      }
    }catch(e){
      console.warn("云端保存失败：", e);
      setStatus("云端保存失败，仅本地生效");
    }
  }

  function toggleMastered(en, on, cardEl){
    if(on) mastered.add(en); else mastered.delete(en);
    if(cardEl) cardEl.classList.toggle("done", on);
    updateProgress();
    saveProgress();
  }

  var listEl     = document.getElementById("list");
  var topicFilterEl = document.getElementById("topicFilter");
  var topicTriggerEl = document.getElementById("topicTrigger");
  var topicValueEl = document.getElementById("topicValue");
  var topicOptionsEl = document.getElementById("topicOptions");
  var selectedTopic = "";
  var searchEl   = document.getElementById("search");
  var statusEl   = document.getElementById("status");
  var countEl    = document.getElementById("count");
  var totalEl    = document.getElementById("total");
  var nounEl     = document.getElementById("noun");
  var progressEl = document.getElementById("progress");
  var resetBtn   = document.getElementById("resetBtn");
  var accountLabel = document.getElementById("accountLabel");
  var phoneInput = document.getElementById("phoneInput");
  var loginBtn   = document.getElementById("loginBtn");
  var logoutBtn  = document.getElementById("logoutBtn");
  var loginHint  = document.getElementById("loginHint");

  function maskPhone(t){ return t.length >= 7 ? (t.slice(0,3) + "****" + t.slice(7)) : t; }
  function updateLoginUI(){
    if(account){
      accountLabel.textContent = "已登录：" + maskPhone(account);
      accountLabel.style.display = "";
      phoneInput.style.display = "none";
      loginBtn.style.display = "none";
      logoutBtn.style.display = "";
      loginHint.style.display = "none";
    }else{
      accountLabel.style.display = "none";
      phoneInput.style.display = "";
      loginBtn.style.display = "";
      logoutBtn.style.display = "none";
      loginHint.style.display = "";
    }
  }

  loginBtn.addEventListener("click", async function(){
    var tel = (phoneInput.value || "").replace(/\D/g, "");
    if(!/^1\d{10}$/.test(tel)){ setStatus("请输入正确的 11 位手机号"); return; }
    account = tel;
    localStorage.setItem("wq_account", tel);
    uid = await accountUid(tel);
    localStorage.setItem("wq_uid", uid);
    updateLoginUI();
    // 登录时合并本机进度 + 云端进度，避免任一设备进度丢失
    var localSnapshot = Array.from(mastered);
    await loadProgress({ merge: true });
    if(localSnapshot.length){
      localSnapshot.forEach(function(e){ mastered.add(e); });
      updateProgress(); render();
      await saveProgress();
    }
    setStatus("已登录，进度跨设备同步");
  });
  logoutBtn.addEventListener("click", async function(){
    localStorage.removeItem("wq_account");
    account = null;
    uid = genLocalUid();
    localStorage.setItem("wq_uid", uid);
    updateLoginUI();
    await loadProgress();
  });

  // 上层分类下拉（单词卡 / 常用句共用逻辑，按当前数据集动态生成）
  function populateCats(){
    var cats = [];
    items.forEach(function(c){ var topic = topicOf(c); if(cats.indexOf(topic)<0) cats.push(topic); });
    cats.sort();
    topicOptionsEl.innerHTML = "";
    var options = [{ value:"", label:"全部分类" }].concat(cats.map(function(c){ return { value:c, label:c }; }));
    if(options.every(function(o){ return o.value !== selectedTopic; })) selectedTopic = "";
    options.forEach(function(option){
      var o = document.createElement("button");
      o.type = "button"; o.className = "topic-option"; o.setAttribute("role", "option");
      o.setAttribute("aria-selected", option.value === selectedTopic ? "true" : "false");
      o.dataset.value = option.value; o.textContent = option.label;
      o.addEventListener("click", function(){ selectedTopic = option.value; topicValueEl.textContent = option.label; closeTopicMenu(); updateTopicOptions(); render(); });
      topicOptionsEl.appendChild(o);
    });
    topicValueEl.textContent = options.find(function(o){ return o.value === selectedTopic; }).label;
    updateTopicOptions();
  }
  function updateTopicOptions(){ Array.prototype.forEach.call(topicOptionsEl.querySelectorAll("[role=option]"), function(option){ option.setAttribute("aria-selected", option.dataset.value === selectedTopic ? "true" : "false"); }); }
  function closeTopicMenu(){ topicTriggerEl.setAttribute("aria-expanded", "false"); topicOptionsEl.hidden = true; }
  function openTopicMenu(){ topicTriggerEl.setAttribute("aria-expanded", "true"); topicOptionsEl.hidden = false; var current = topicOptionsEl.querySelector('[aria-selected="true"]'); if(current) current.focus(); }
  function moveTopicOption(step){ var options = Array.prototype.slice.call(topicOptionsEl.querySelectorAll("[role=option]")); var current = options.findIndex(function(option){ return option.dataset.value === selectedTopic; }); var next = options[(current + step + options.length) % options.length]; if(next){ selectedTopic = next.dataset.value; topicValueEl.textContent = next.textContent; updateTopicOptions(); next.focus(); render(); } }
  topicTriggerEl.addEventListener("click", function(){ if(topicOptionsEl.hidden) openTopicMenu(); else closeTopicMenu(); });
  topicTriggerEl.addEventListener("keydown", function(e){ if(e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Enter" || e.key === " "){ e.preventDefault(); if(topicOptionsEl.hidden) openTopicMenu(); else moveTopicOption(e.key === "ArrowUp" ? -1 : 1); } });
  topicOptionsEl.addEventListener("keydown", function(e){
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); moveTopicOption(e.key === "ArrowUp" ? -1 : 1); }
    else if(e.key === "Home" || e.key === "End"){ e.preventDefault(); var options = topicOptionsEl.querySelectorAll("[role=option]"); var target = options[e.key === "Home" ? 0 : options.length - 1]; if(target){ selectedTopic = target.dataset.value; topicValueEl.textContent = target.textContent; updateTopicOptions(); target.focus(); render(); } }
    else if(e.key === "Escape"){ e.preventDefault(); closeTopicMenu(); topicTriggerEl.focus(); }
    else if(e.key === "Enter" || e.key === " "){ e.preventDefault(); closeTopicMenu(); topicTriggerEl.focus(); }
  });
  document.addEventListener("click", function(e){ if(!topicFilterEl.contains(e.target)) closeTopicMenu(); });
  populateCats();
  totalEl.textContent = items.length;

  var statusTimer = null;
  function setStatus(msg){
    statusEl.textContent = msg || "";
    if(statusTimer) clearTimeout(statusTimer);
    if(msg){
      statusTimer = setTimeout(function(){ statusEl.textContent = ""; }, 2500);
    }
  }

  // ---- 朗读：按词库语言选 voice；默认英式 en-GB，无则回退 en-US ----
  // 仅「意大利语/法语/瑞士」等外语分类用对应语言朗读，其余英文场景用 en-GB
  var LANG_MAP = {
    "意大利语":"it-IT", "意大利":"it-IT",
    "法语":"fr-FR", "法国":"fr-FR",
    "瑞士":"de-CH", "瑞士出行":"de-CH"
  };
  var LOGO_MAP = {
    "万能句":"assets/category-01.webp",
    "交通出行":"assets/category-02.webp",
    "交通问路":"assets/category-03.webp",
    "医疗急诊":"assets/category-04.webp",
    "咖啡店":"assets/category-05.webp",
    "意大利":"assets/category-06.webp",
    "意大利语":"assets/category-07.webp",
    "数字时间":"assets/category-08.webp",
    "日常表达":"assets/category-09.webp",
    "机场出入境":"assets/category-10.webp",
    "机场海关":"assets/category-11.webp",
    "法国":"assets/category-12.webp",
    "法语":"assets/category-13.webp",
    "瑞士":"assets/category-14.webp",
    "瑞士出行":"assets/category-15.webp",
    "社交礼貌":"assets/category-16.webp",
    "紧急情况":"assets/category-17.webp",
    "购物付款":"assets/category-18.webp",
    "购物退税":"assets/category-19.webp",
    "酒店":"assets/category-20.webp",
    "酒店住宿":"assets/category-21.webp",
    "问路地标":"assets/category-22.webp",
    "闲聊":"assets/category-23.webp",
    "餐厅":"assets/category-24.webp",
    "餐厅点餐":"assets/category-25.webp"
  };
  var DEFAULT_LOGO = "assets/whale-logo.png";
  var LIFE_ICON_MAP = {"动物":"🐾","交通":"🚗","地点":"📍","服装":"👕","颜色":"🎨","人物":"👥","工作":"💼","社会":"🌐","艺术":"🎵","饮料":"☕","食物":"🍽️","家内":"🏠","电子产品":"💻","身体":"❤️","大自然":"🌿","材料":"🧱","数学/测量":"📏","其他名词":"🧩","方向":"🧭","季节":"🌤️","数字":"🔢","月份":"🗓️","一周":"📅","时期":"⏰","动词":"✍️","形容词":"✨","代词":"👤","副词":"⚡","介词 & 连词":"🔗","情态助动词":"🛠️","天气气象":"☁️","医疗-病痛":"🩺","购物交易":"🛒","情绪抽象名词":"💭","果蔬统称":"🥕","情绪感受形容词":"🙂"};
  function categoryLogo(cat){ if(LOGO_MAP[cat]) return LOGO_MAP[cat]; var icon=LIFE_ICON_MAP[cat]; if(!icon) return DEFAULT_LOGO; return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#e4f5f1"/><text x="24" y="31" text-anchor="middle" font-size="24">' + icon + '</text></svg>'); }
  var voiceReady = false;
  function pickVoice(preferredLang){
    if(!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    if(!voices.length) return null;
    if(preferredLang){
      var matched = voices.find(function(x){
        return x.lang && x.lang.toLowerCase().indexOf(preferredLang.toLowerCase()) === 0;
      });
      if(matched) return matched;
    }
    return voices.find(function(v){ return v.lang === "en-GB"; })
        || voices.find(function(v){ return v.lang === "en-US"; })
        || voices.find(function(v){ return /^en/i.test(v.lang); })
        || null;
  }
  function speak(text, btn, lang){
    if(!("speechSynthesis" in window)){
      setStatus("此浏览器不支持语音朗读");
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice(lang);
    if(v){ u.lang = v.lang; u.voice = v; }
    else { u.lang = lang || "en-GB"; }
    u.rate = 0.95;
    u.onstart = function(){ setStatus("正在朗读…"); if(btn) btn.classList.add("playing"); };
    u.onend   = function(){ setStatus(""); if(btn) btn.classList.remove("playing"); };
    u.onerror = function(){ setStatus("朗读失败，请重试"); if(btn) btn.classList.remove("playing"); };
    window.speechSynthesis.speak(u);
  }
  if("speechSynthesis" in window){
    if(window.speechSynthesis.getVoices().length){ voiceReady = true; }
    window.speechSynthesis.onvoiceschanged = function(){ voiceReady = true; };
  } else {
    setStatus("提示：当前浏览器不支持语音，可用 Chrome / Edge / Safari");
  }

  function render(){
    var topic = selectedTopic;
    var q = searchEl.value.trim().toLowerCase();
    var filtered = items.filter(function(w){
      if(topic && topicOf(w) !== topic) return false;
      if(q){
        var hay = (w.en + " " + w.zh + " " + (w.phrase||"")).toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    listEl.innerHTML = "";
    if(!filtered.length){
      listEl.innerHTML = '<div class="empty"><img class="empty-logo" src="assets/cat-logo.png" alt="">没有匹配的内容</div>';
      countEl.textContent = "0 个";
      return;
    }
    countEl.textContent = filtered.length + " 个";
    var langOf = function(w){ return LANG_MAP[w.cat] || null; };
    var lastGroup = null;
    var visible = filtered.slice();
    if(!topic){ visible.sort(function(a,b){ return a.cat.localeCompare(b.cat, "zh-CN"); }); }
    visible.forEach(function(w){
      // 每个筛选结果都按场景插入分组标题，保持不同上层分类的阅读结构一致
      if(w.cat !== lastGroup){
        lastGroup = w.cat;
        var gh = document.createElement("div");
        gh.className = "group-head";
        var logo = categoryLogo(w.cat);
        var gi = document.createElement("img");
        gi.className = "group-logo";
        gi.src = logo;
        gi.alt = "";
        gi.setAttribute("aria-hidden", "true");
        gh.appendChild(gi);
        var gt = document.createElement("span");
        gt.textContent = w.cat;
        gh.appendChild(gt);
        listEl.appendChild(gh);
      }

      var card = document.createElement("div");
      card.className = "card" + (mastered.has(w.en) ? " done" : "");
      card.tabIndex = 0;
      card.setAttribute("aria-label", "点击朗读 " + w.en);

      var row = document.createElement("div");
      row.className = "row";

      var left = document.createElement("div");
      left.style.flex = "1";
      var en = document.createElement("div");
      en.className = "en"; en.textContent = w.en;
      var zh = document.createElement("div");
      zh.className = "zh"; zh.textContent = w.zh;
      left.appendChild(en); left.appendChild(zh);

      var spk = document.createElement("button");
      spk.className = "spk"; spk.type = "button";
      spk.setAttribute("aria-label", "朗读 " + w.en);
      spk.textContent = "🔊";
      var lang = langOf(w);
      spk.addEventListener("click", function(ev){
        ev.stopPropagation();
        speak(w.en, spk, lang);
      });

      row.appendChild(left); row.appendChild(spk);

      var tag = document.createElement("span");
      tag.className = "cat-tag"; tag.textContent = w.cat;

      card.appendChild(row);
      if(w.phrase){ var p = document.createElement("div"); p.className="phrase"; p.textContent = w.phrase; card.appendChild(p); }
      card.appendChild(tag);

      var toggle = document.createElement("label");
      toggle.className = "mastered-toggle";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = mastered.has(w.en);
      cb.setAttribute("aria-label", "标记 " + w.en + " 已掌握");
      cb.addEventListener("click", function(ev){ ev.stopPropagation(); });
      cb.addEventListener("change", function(){ toggleMastered(w.en, cb.checked, card); });
      var tlabel = document.createElement("span");
      tlabel.textContent = "已掌握";
      toggle.appendChild(cb); toggle.appendChild(tlabel);
      card.appendChild(toggle);

      // 整卡点按 / 键盘（Enter、空格）均可朗读，与鼠标行为对齐
      card.addEventListener("click", function(){ speak(w.en, spk, lang); });
      card.addEventListener("keydown", function(e){
        if(e.target === card && (e.key === "Enter" || e.key === " ")){
          e.preventDefault();
          speak(w.en, spk, lang);
        }
      });
      listEl.appendChild(card);
    });
  }

  searchEl.addEventListener("input", render);
  resetBtn.addEventListener("click", function(){
    mastered.clear();
    updateProgress();
    render();
    saveProgress();
  });

  // ===== 模式切换（单词卡 / 常用句）=====
  var modeTabs = Array.prototype.slice.call(document.querySelectorAll(".mode-tab"));
  function switchMode(key){
    if(!DATASETS[key] || key === activeKey) return;
    activeKey = key;
    items = DATASETS[activeKey].items;
    mastered = loadLocalMastered(activeKey);
    searchEl.value = "";
    selectedTopic = "";
    populateCats();
    totalEl.textContent = items.length;
    if(nounEl) nounEl.textContent = DATASETS[activeKey].noun;
    updateProgress();
    render();
    modeTabs.forEach(function(b){
      var on = b.dataset.mode === activeKey;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    });
    listEl.setAttribute("aria-labelledby", activeKey === "words" ? "tab-words" : "tab-sentences");
    loadProgress();
  }
  modeTabs.forEach(function(b){
    b.addEventListener("click", function(){ switchMode(b.dataset.mode); });
  });
  // 标签页键盘导航（左右/上下/Home/End），符合 WAI-ARIA tabs 模式
  var tabsWrap = document.querySelector(".mode-tabs");
  tabsWrap.addEventListener("keydown", function(e){
    var idx = modeTabs.indexOf(document.activeElement);
    if(idx < 0) return;
    var next = -1;
    if(e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % modeTabs.length;
    else if(e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx - 1 + modeTabs.length) % modeTabs.length;
    else if(e.key === "Home") next = 0;
    else if(e.key === "End") next = modeTabs.length - 1;
    if(next >= 0){ e.preventDefault(); modeTabs[next].focus(); switchMode(modeTabs[next].dataset.mode); }
  });

  // 「更多设置」折叠：把进度 / 登录区收起，首屏更清爽
  var extrasToggle = document.getElementById("extrasToggle");
  var headerExtras = document.getElementById("headerExtras");
  extrasToggle.addEventListener("click", function(){
    var open = headerExtras.classList.toggle("open");
    extrasToggle.setAttribute("aria-expanded", open ? "true" : "false");
    extrasToggle.textContent = open ? "收起设置 ▴" : "更多设置 ▾";
  });
  listEl.setAttribute("aria-labelledby", "tab-words");

  // 初始化：支持 #words / #sentences 直达
  var initialMode = (location.hash || "").replace("#","");
  if(!DATASETS[initialMode]) initialMode = "words";
  if(initialMode !== activeKey) switchMode(initialMode); else {
    updateProgress();
    render();
    if(nounEl) nounEl.textContent = DATASETS[activeKey].noun;
  }
  updateLoginUI();
  (async function(){
    if(account){
      try{ uid = await accountUid(account); localStorage.setItem("wq_uid", uid); }catch(e){}
    }
    await loadProgress();
  })();

  // 切回页面时自动同步云端最新进度（跨设备场景）
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      loadProgress({ showError: false });
    }
  });
})();
</script>
</body>
</html>
