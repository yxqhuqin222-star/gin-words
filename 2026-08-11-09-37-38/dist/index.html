<style>

  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:18px 20px 14px; position:sticky; top:0; z-index:10;
  }
  h1{font-size:20px; margin:0 0 2px;}
  .sub{color:var(--muted); font-size:13px; margin:0 0 12px;}
  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  select, input[type=search]{
    font-size:15px; padding:9px 12px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--text); outline:none;
  }
  select{min-width:130px;}
  input[type=search]{flex:1; min-width:160px;}
  select:focus, input[type=search]:focus{border-color:var(--accent);}
  .count{color:var(--muted); font-size:13px; margin-left:auto;}
  #status{
    margin:10px 20px 0; font-size:13px; min-height:18px; color:var(--accent);
    transition:opacity .2s;
  }
  main{
    max-width:880px; margin:0 auto; padding:16px 20px 48px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); cursor:pointer;
    display:flex; flex-direction:column; gap:6px; transition:transform .08s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.10);}
  .card:active{transform:translateY(0);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .en{font-size:21px; font-weight:600; letter-spacing:.2px;}
  .zh{font-size:15px; color:#374151;}
  .phrase{font-size:13px; color:var(--muted); font-style:italic; margin-top:2px;}
  .cat-tag{
    display:inline-block; font-size:11px; color:var(--accent);
    background:var(--accent-soft); border-radius:6px; padding:1px 7px; margin-top:2px;
  }
  .spk{
    flex:0 0 auto; width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:#fff; color:var(--accent);
    font-size:17px; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .spk:hover{background:var(--accent-soft);}
  .spk.playing{background:var(--accent); color:#fff;}
  .empty{text-align:center; color:var(--muted); padding:40px 0; grid-column:1/-1;}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:0 20px 30px;}
  @media (max-width:520px){
    main{grid-template-columns:1fr;}
    h1{font-size:18px;}
  }
  .progress-row{display:flex; align-items:center; gap:14px; margin-top:10px; font-size:13px; color:var(--muted);}
  #progress{font-variant-numeric:tabular-nums;}
  .link-btn{border:none; background:none; color:var(--accent); cursor:pointer; font-size:13px; padding:0; text-decoration:underline;}
  .link-btn:hover{opacity:.8;}
  .mastered-toggle{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-top:6px; cursor:pointer; user-select:none;}
  .mastered-toggle input{accent-color:var(--accent); width:15px; height:15px; margin:0; cursor:pointer;}
  .card.done{opacity:.55;}
  .card.done .en{text-decoration:line-through;}
  .login-row{display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13px;}
  .login-input{font-size:13px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; outline:none; width:200px;}
  .login-input:focus{border-color:var(--accent);}
  .account-tag{color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:2px 8px; font-size:12px;}
  .login-hint{margin-top:6px; font-size:12px; color:#b06a00; background:#fff7e6; border:1px solid #ffd591; border-radius:8px; padding:6px 10px;}
  .mode-tabs{display:flex; gap:8px; margin:12px 0 6px;}
  .mode-tab{font-size:14px; padding:7px 18px; border:1px solid var(--line); background:#fff; color:var(--text); border-radius:999px; cursor:pointer; transition:border-color .15s, background .15s, color .15s;}
  .mode-tab:hover{border-color:var(--accent);}
  .mode-tab.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
</style>

<script type="module">
(function(){
  "use strict";
  var WORDS = [];
  try{
    WORDS = JSON.parse(document.getElementById("word-data").textContent);
  }catch(e){
    console.error("词库解析失败：", e);
    document.getElementById("list").innerHTML = '<div class="empty">词库加载失败</div>';
    return;
  }

  var SENTENCES = [];
  try{
    SENTENCES = JSON.parse(document.getElementById("sentence-data").textContent);
  }catch(e){
    console.error("句库解析失败：", e);
    SENTENCES = [];
  }

  // 两种学习数据：单词卡 / 常用句
  var DATASETS = {
    words:     { key:"words",     items: WORDS,     noun:"单词" },
    sentences: { key:"sentences", items: SENTENCES, noun:"句子" }
  };
  var activeKey = "words";
  var items = DATASETS[activeKey].items;

  // ===== 学习进度（云端同步 + 本地兜底） =====
  // 云端接口：POST https://xiaoqin-d0g0prppaa09e675e.service.tcloudbase.com/wp
  // 入参 { action:"get"|"set", uid, mastered:[...] }，返回 { ok, mastered:[...] }
  var API = "https://xiaoqin-d0g0prppaa09e675e.service.tcloudbase.com/wp";
  var mastered = new Set();

  // 进度按数据集分别存储：本地独立 key；云端仅 words（旧云函数不支持 scope 隔离，常用句纯本地）
  (function(){
    try{
      if(!localStorage.getItem("wq_mastered_words") && localStorage.getItem("wq_mastered")){
        localStorage.setItem("wq_mastered_words", localStorage.getItem("wq_mastered"));
      }
    }catch(e){}
  })();
  function loadLocalMastered(key){
    try{
      var raw = localStorage.getItem("wq_mastered_" + key);
      if(raw){ var a = JSON.parse(raw); if(Array.isArray(a)) return new Set(a); }
    }catch(e){}
    return new Set();
  }
  function saveLocalMastered(key, set){
    try{ localStorage.setItem("wq_mastered_" + key, JSON.stringify(Array.from(set))); }catch(e){}
  }
  mastered = loadLocalMastered(activeKey);

  // uid 来源：登录后用手机号派生的稳定 uid（跨设备一致）；未登录用本机随机 uid（仅本机）
  function genLocalUid(){
    var u = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("u-" + Date.now() + "-" + Math.random().toString(16).slice(2));
    return u;
  }
  var uid = localStorage.getItem("wq_uid") || genLocalUid();
  localStorage.setItem("wq_uid", uid);
  var account = localStorage.getItem("wq_account") || null; // 已登录手机号

  // 手机号 -> 云端稳定 uid（SHA-256，避免直接暴露手机号）
  async function accountUid(tel){
    try{
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(tel + "@euro-words"));
      return "a-" + Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    }catch(e){
      // 兜底：不支持 subtle 时退化为简单哈希
      var h = 0; for(var i=0;i<tel.length;i++){ h = (h*31 + tel.charCodeAt(i)) >>> 0; }
      return "a-fallback-" + h;
    }
  }

  function updateProgress(){
    if(progressEl) progressEl.textContent = "已掌握 " + mastered.size + " / " + items.length;
  }

  async function loadProgress(opts){
    opts = opts || {};
    // 本地兜底优先：按当前数据集读取，保证秒开
    mastered = loadLocalMastered(activeKey);
    // 云端同步（仅 words 数据集，旧云函数不支持 scope 隔离）
    if(activeKey === "words"){
      try{
        var res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get", uid: uid, scope: activeKey })
        });
        var r = await res.json();
        if(r && r.ok && Array.isArray(r.mastered)){
          if(opts.merge){
            r.mastered.forEach(function(en){ if(en) mastered.add(en); });
          }else{
            mastered = new Set();
            r.mastered.forEach(function(en){ if(en) mastered.add(en); });
          }
        }
      }catch(e){
        console.warn("云端读取失败，使用本地进度：", e);
        if(opts.showError) setStatus("同步失败，使用本地进度");
      }
    }
    updateProgress();
    render();
  }

  async function saveProgress(){
    // 本地兜底写入（按当前数据集）
    saveLocalMastered(activeKey, mastered);
    // 云端同步（仅 words 数据集；常用句纯本地，避免污染旧云函数的单一进度字段）
    if(activeKey !== "words") return;
    try{
      var res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "set", uid: uid, scope: activeKey, mastered: Array.from(mastered) })
      });
      var r = await res.json();
      if(r && r.ok){
        setStatus("进度已同步到云端");
      }else{
        setStatus("云端保存失败：" + (r && r.error ? r.error : "unknown"));
      }
    }catch(e){
      console.warn("云端保存失败：", e);
      setStatus("云端保存失败，仅本地生效");
    }
  }

  function toggleMastered(en, on, cardEl){
    if(on) mastered.add(en); else mastered.delete(en);
    if(cardEl) cardEl.classList.toggle("done", on);
    updateProgress();
    saveProgress();
  }

  var listEl     = document.getElementById("list");
  var catEl      = document.getElementById("catFilter");
  var searchEl   = document.getElementById("search");
  var statusEl   = document.getElementById("status");
  var countEl    = document.getElementById("count");
  var totalEl    = document.getElementById("total");
  var nounEl     = document.getElementById("noun");
  var progressEl = document.getElementById("progress");
  var resetBtn   = document.getElementById("resetBtn");
  var accountLabel = document.getElementById("accountLabel");
  var phoneInput = document.getElementById("phoneInput");
  var loginBtn   = document.getElementById("loginBtn");
  var logoutBtn  = document.getElementById("logoutBtn");
  var loginHint  = document.getElementById("loginHint");

  function maskPhone(t){ return t.length >= 7 ? (t.slice(0,3) + "****" + t.slice(7)) : t; }
  function updateLoginUI(){
    if(account){
      accountLabel.textContent = "已登录：" + maskPhone(account);
      accountLabel.style.display = "";
      phoneInput.style.display = "none";
      loginBtn.style.display = "none";
      logoutBtn.style.display = "";
      loginHint.style.display = "none";
    }else{
      accountLabel.style.display = "none";
      phoneInput.style.display = "";
      loginBtn.style.display = "";
      logoutBtn.style.display = "none";
      loginHint.style.display = "";
    }
  }

  loginBtn.addEventListener("click", async function(){
    var tel = (phoneInput.value || "").trim();
    if(!/^1\d{10}$/.test(tel)){ setStatus("请输入正确的 11 位手机号"); return; }
    account = tel;
    localStorage.setItem("wq_account", tel);
    uid = await accountUid(tel);
    localStorage.setItem("wq_uid", uid);
    updateLoginUI();
    // 登录时合并本机进度 + 云端进度，避免任一设备进度丢失
    var localSnapshot = Array.from(mastered);
    await loadProgress({ merge: true });
    if(localSnapshot.length){
      localSnapshot.forEach(function(e){ mastered.add(e); });
      updateProgress(); render();
      await saveProgress();
    }
    setStatus("已登录，进度跨设备同步");
  });
  logoutBtn.addEventListener("click", async function(){
    localStorage.removeItem("wq_account");
    account = null;
    uid = genLocalUid();
    localStorage.setItem("wq_uid", uid);
    updateLoginUI();
    await loadProgress();
  });

  // 分类下拉（按当前数据集动态生成，切换模式时重建）
  function populateCats(){
    catEl.innerHTML = '<option value="">全部分类</option>';
    var cats = [];
    items.forEach(function(c){ if(cats.indexOf(c.cat)<0) cats.push(c.cat); });
    cats.sort();
    cats.forEach(function(c){
      var o = document.createElement("option");
      o.value = c; o.textContent = c; catEl.appendChild(o);
    });
  }
  populateCats();
  totalEl.textContent = items.length;

  var statusTimer = null;
  function setStatus(msg){
    statusEl.textContent = msg || "";
    if(statusTimer) clearTimeout(statusTimer);
    if(msg){
      statusTimer = setTimeout(function(){ statusEl.textContent = ""; }, 2500);
    }
  }

  // ---- 朗读：默认英式 en-GB，无则回退 en-US ----
  var voiceReady = false;
  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices();
    if(!voices.length) return null;
    return voices.find(function(v){ return v.lang === "en-GB"; })
        || voices.find(function(v){ return v.lang === "en-US"; })
        || voices.find(function(v){ return /^en/i.test(v.lang); })
        || null;
  }
  function speak(text, btn){
    if(!("speechSynthesis" in window)){
      setStatus("此浏览器不支持语音朗读");
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice();
    if(v){ u.lang = v.lang; u.voice = v; }
    else { u.lang = "en-GB"; }
    u.rate = 0.95;
    u.onstart = function(){ setStatus("正在朗读…"); if(btn) btn.classList.add("playing"); };
    u.onend   = function(){ setStatus(""); if(btn) btn.classList.remove("playing"); };
    u.onerror = function(){ setStatus("朗读失败，请重试"); if(btn) btn.classList.remove("playing"); };
    window.speechSynthesis.speak(u);
  }
  if("speechSynthesis" in window){
    if(window.speechSynthesis.getVoices().length){ voiceReady = true; }
    window.speechSynthesis.onvoiceschanged = function(){ voiceReady = true; };
  } else {
    setStatus("提示：当前浏览器不支持语音，可用 Chrome / Edge / Safari");
  }

  function render(){
    var cat = catEl.value;
    var q = searchEl.value.trim().toLowerCase();
    var filtered = items.filter(function(w){
      if(cat && w.cat !== cat) return false;
      if(q){
        var hay = (w.en + " " + w.zh + " " + (w.phrase||"")).toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    listEl.innerHTML = "";
    if(!filtered.length){
      listEl.innerHTML = '<div class="empty">没有匹配的内容</div>';
      countEl.textContent = "0 个";
      return;
    }
    countEl.textContent = filtered.length + " 个";
    filtered.forEach(function(w){
      var card = document.createElement("div");
      card.className = "card" + (mastered.has(w.en) ? " done" : "");

      var row = document.createElement("div");
      row.className = "row";

      var left = document.createElement("div");
      left.style.flex = "1";
      var en = document.createElement("div");
      en.className = "en"; en.textContent = w.en;
      var zh = document.createElement("div");
      zh.className = "zh"; zh.textContent = w.zh;
      left.appendChild(en); left.appendChild(zh);

      var spk = document.createElement("button");
      spk.className = "spk"; spk.type = "button";
      spk.setAttribute("aria-label", "朗读 " + w.en);
      spk.textContent = "🔊";
      spk.addEventListener("click", function(ev){
        ev.stopPropagation();
        speak(w.en, spk);
      });

      row.appendChild(left); row.appendChild(spk);

      var tag = document.createElement("span");
      tag.className = "cat-tag"; tag.textContent = w.cat;

      card.appendChild(row);
      if(w.phrase){ var p = document.createElement("div"); p.className="phrase"; p.textContent = w.phrase; card.appendChild(p); }
      card.appendChild(tag);

      var toggle = document.createElement("label");
      toggle.className = "mastered-toggle";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = mastered.has(w.en);
      cb.setAttribute("aria-label", "标记 " + w.en + " 已掌握");
      cb.addEventListener("click", function(ev){ ev.stopPropagation(); });
      cb.addEventListener("change", function(){ toggleMastered(w.en, cb.checked, card); });
      var tlabel = document.createElement("span");
      tlabel.textContent = "已掌握";
      toggle.appendChild(cb); toggle.appendChild(tlabel);
      card.appendChild(toggle);

      card.addEventListener("click", function(){ speak(w.en, spk); });
      listEl.appendChild(card);
    });
  }

  catEl.addEventListener("change", render);
  searchEl.addEventListener("input", render);
  resetBtn.addEventListener("click", function(){
    mastered.clear();
    updateProgress();
    render();
    saveProgress();
  });

  // ===== 模式切换（单词卡 / 常用句）=====
  var modeTabs = Array.prototype.slice.call(document.querySelectorAll(".mode-tab"));
  function switchMode(key){
    if(!DATASETS[key] || key === activeKey) return;
    activeKey = key;
    items = DATASETS[activeKey].items;
    mastered = loadLocalMastered(activeKey);
    searchEl.value = "";
    populateCats();
    totalEl.textContent = items.length;
    if(nounEl) nounEl.textContent = DATASETS[activeKey].noun;
    updateProgress();
    render();
    modeTabs.forEach(function(b){ b.classList.toggle("active", b.dataset.mode === activeKey); });
    loadProgress();
  }
  modeTabs.forEach(function(b){
    b.addEventListener("click", function(){ switchMode(b.dataset.mode); });
  });

  // 初始化：支持 #words / #sentences 直达
  var initialMode = (location.hash || "").replace("#","");
  if(!DATASETS[initialMode]) initialMode = "words";
  if(initialMode !== activeKey) switchMode(initialMode); else {
    updateProgress();
    render();
    if(nounEl) nounEl.textContent = DATASETS[activeKey].noun;
  }
  updateLoginUI();
  (async function(){
    if(account){
      try{ uid = await accountUid(account); localStorage.setItem("wq_uid", uid); }catch(e){}
    }
    await loadProgress();
  })();

  // 切回页面时自动同步云端最新进度（跨设备场景）
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      loadProgress({ showError: false });
    }
  });
})();
</script>
</body>
